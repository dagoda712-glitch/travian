name: Travian 記錄與自動升級（Playwright + session cache 版）

on:
  #schedule:
    # UTC。GitHub 高峰時可能延遲十幾分鐘。排程只會在預設分支（main）觸發；其他分支請用手動執行。
    # */40 = 每小時的第 0 分與第 40 分（間隔 40、20 分鐘交替，不是每 30 分鐘）。
    # 目前：全天都跑，QUIET_UTC 為 "0,0"（永不安靜），所以全天正常建造。
    #- cron: "*/40 * * * *"
    # 想啟用夜間降頻（UTC 17~22 = 台灣 01:00~06:59 只做 keep-alive）時，改成下面兩條，
    # 並把 QUIET_UTC 改成 "17,23"（UTC 17 點在第一條範圍內，那兩次也會只做 keep-alive）：
    #- cron: "*/40 0-17,23 * * *"
    #- cron: "0 18-22 * * *"
    # 完全不跑會讓 session 因閒置過久失效（實測過：整段約 6~7 小時沒請求，cache 與種子 Cookie 都會壞），
    # 所以降頻時要保留 keep-alive，不能停跑。
  workflow_dispatch: {}   # 手動執行：在 Actions 頁面選分支後按 Run workflow

concurrency:
  group: travian
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 快取 Playwright 下載的瀏覽器核心（Chromium/FFmpeg 等，約 300MB）。
      # playwright install 本身會自動偵測本機是否已有對應版本，
      # cache 命中時會直接跳過下載，不需要額外的條件判斷。
      - name: 還原 Playwright 瀏覽器快取
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('requirements.txt') }}

      - name: 安裝 Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # 每一輪都會存一份新的（key 帶 run_id），同時用 restore-keys
      # 模糊比對回「最近一次成功」的那份，讓 session 狀態能接續下去。
      - name: 還原上一輪的 session 狀態
        uses: actions/cache@v4
        with:
          path: travian_state.json
          key: travian-state-${{ github.run_id }}
          restore-keys: travian-state-

      - name: 記錄村莊數據 + 自動升級資源田
        env:
          TRAVIAN_BASE_URL: ${{ secrets.TRAVIAN_BASE_URL }}
          TRAVIAN_SEED_COOKIE: ${{ secrets.TRAVIAN_SEED_COOKIE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # "0" = 正式，會真的送出升級請求；"1" = 乾跑，只印出會送出什麼。
          # main 一律用 "0"；在分支（例如 refactor）測試時才改成 "1"，合併回 main 前改回 "0"。
          DRY_RUN: "0"
          # 安靜時段「起,迄」（UTC，起 ≤ 小時 < 迄）：這段時間只做 keep-alive、不建造。
          # "0,0" = 起迄相同 = 永不安靜（目前）；"17,23" = UTC 17~22 安靜。需與上面的 cron 搭配。
          QUIET_UTC: "0,0"
        run: python travian_ci_run.py

        
        #run: python test_transfer.py
        #run: python test_hero_cycle.py
        #run: python debug_login_flow.py
        #run: python debug_village_buildings.py

      - name: 上傳診斷用的原始 HTML（debug_html/）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_html/
          if-no-files-found: ignore
          retention-days: 3
